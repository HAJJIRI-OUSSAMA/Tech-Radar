name: nightly-digest

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 08:00 Casablanca (UTC+1)
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write # required to commit the archive back (the keepalive)

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest and send
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
          LLM_BATCH_SIZE: ${{ secrets.LLM_BATCH_SIZE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m digest.run --send

      - name: Commit archive
        if: always() # archive even if scoring failed, for debugging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          git diff --staged --quiet || git commit -m "chore: nightly digest archive [skip ci]"
          git push
